<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="ACADEMIA CONNECT - Plateforme moderne de gestion et de suivi scolaire pour les établissements d'enseignement." />
  <script>
    // Polyfill pour crypto.randomUUID (indispensable sur les connexions HTTP non-sécurisées)
    if (!window.crypto || !window.crypto.randomUUID) {
      if (!window.crypto) window.crypto = {};
      window.crypto.randomUUID = function () {
        return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
          var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
          return v.toString(16);
        });
      };
    }
  </script>
  <title>Academia Connect</title>
</head>

</body>
