server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Optional: proxy API requests to the backend (to avoid CORS issues in production)
    # This assumes the backend is accessible at http://backend:8080 or handled by CloudFront/ALB
    # location /api {
    #     proxy_pass http://backend-service:8080;
    # }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
